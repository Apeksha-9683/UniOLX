# alembic.ini
# -----------
# Alembic configuration file.
# 'sqlalchemy.url' is intentionally left blank here — it is set at runtime
# inside alembic/env.py by reading from your .env file.
# This prevents your database URL from ever being written to a file.

[alembic]
# Path to migration scripts, relative to this file
script_location = alembic

# File name pattern for generated migration files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Leave this blank — the URL is set in alembic/env.py from environment variables
sqlalchemy.url =

[post_write_hooks]
# Optional: auto-format migration files with black
# hooks = black
# black.type = console_scripts
# black.entrypoint = black

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
